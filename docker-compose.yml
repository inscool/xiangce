services:
  db:
    image: postgres:16-alpine
    container_name: xiangce-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: opencode_xiangce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - xiangce-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opencode_xiangce"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: xiangce-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./web/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/opencode_xiangce?schema=public
      ADMIN_EMAIL: admin@local.dev
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
    ports:
      - "4000:4000"
    volumes:
      - xiangce-uploads:/app/public/uploads

volumes:
  xiangce-pgdata:
  xiangce-uploads:
